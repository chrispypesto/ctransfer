[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctransfer"
version = "0.1.0"
description = "Move a live Claude Code session to a cloud VM and back"
requires-python = ">=3.10"
dependencies = ["boto3[crt]>=1.34"]  # crt: needed for `aws login` credentials

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ctransfer = "ctransfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
